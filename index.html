<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting Room L8</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rubik', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }
    .container {
      padding: 40px 20px;
    }
    .number-display {
      font-size: 8em;
      margin: 20px 0;
      color: hotpink;
      font-family: 'Rubik', sans-serif;
      font-weight: 900;
      -webkit-text-stroke: 0.8px rgba(120,0,60,0.35);
      text-shadow: 0 2px 0 rgba(0,0,0,0.06), 0 6px 12px rgba(0,0,0,0.04);
      letter-spacing: 0.02em;
    }
    .timestamp {
      font-size: 1.2em;
      color: #666;
      margin-bottom: 30px;
    }
    button {
      font-size: 2em;
      padding: 15px 30px;
      margin: 20px auto;
      display: block;
      font-family: 'Rubik', sans-serif;
      font-weight: 700;
      background-color: #66ccff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:enabled {
      background-color: #66ccff;
      color: white;
    }

    button:hover:enabled {
      background-color: #3399ff;
    }

    button:disabled {
      background-color: #cccccc;
      color: #666;
      cursor: not-allowed;
      opacity: 1;
    }

    /* Warning for numbers above the weekly limit (see limits.js).
       Slow blink (1 s cycle) – deliberately calm, not a fast flash. */
    .limit-warning {
      display: none;
      font-size: 1.6em;
      font-weight: 700;
      color: #d00000;
      max-width: 700px;
      margin: 10px auto 0;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink {
      50% { opacity: 0.2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .limit-warning { animation: none; }
    }

    /* "Numbers can only be obtained ..." text shown in place of the number
       outside Thursday 12:00+ (phone size: see end of style block). */
    .number-display.closed-notice {
      font-size: 2em;
    }

    /* Announcement of the weekly limit before distribution starts (no blinking) */
    .limit-announcement {
      display: none;
      font-size: 1.6em;
      font-weight: 700;
      color: #d00000;
      max-width: 700px;
      margin: 10px auto 0;
    }

    .error-message {
      font-size: 1.5em;
      color: red;
      margin-top: 50px;
      font-family: 'Rubik', sans-serif;
    }

    .logo {
      max-width: 120px;
      margin-bottom: 20px;
    }

    /* Phones: smaller spacing and text so the button stays visible without
       scrolling (checked on iPhone 13 Pro, 390 x 664 visible in Safari).
       Kept last so these rules override the ones above. */
    @media (max-width: 600px) {
      .container {
        padding-top: 16px;
      }
      .logo {
        max-width: 70px;
        margin-bottom: 8px;
      }
      .number-display.closed-notice,
      .limit-announcement {
        font-size: 1.3em;
      }
      button {
        font-size: 1.4em;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="limits.js"></script>
</head>
<body>
  <div class="container">
    <img src="Logo Offen O Positiv.png" alt="Logo" class="logo">
    <h2>Waiting Room L8</h2>

    <p><strong>Welcome to our Card Exchange!</strong><br>Please consider that we change only once per Person.</p>
    <div style="margin-bottom: 20px;">
      <a href="https://offen-muenchen.de/" target="_blank">
        Link to other exchange offices
      </a>
    </div>

    <div class="week-display" id="weekDisplay" style="font-size: 1.5em; color: hotpink; font-weight: 700; margin-bottom: 10px;"></div>
    <div class="limit-warning" id="limitWarning"></div>
    <div class="number-display" id="yourNumber">--</div>
    <div class="limit-announcement" id="limitAnnouncement"></div>
    <div class="timestamp" id="timestamp">No number yet</div>

    <button id="drawButton" disabled>Click to get a number</button>
    <div id="timeInfo" style="margin-top:10px; font-size:1.1em; color:#555;"></div>
  </div>

  <script>
    // Funktion zur Berechnung der Kalenderwoche nach ISO 8601
    function getWeekNumber(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    // Aktuelle Woche automatisch ermitteln
    const now = new Date();
    const currentWeek = getWeekNumber(now);
    const currentYear = now.getFullYear();
    const weekParam = `CW${currentWeek}-${currentYear}`;

    window.onload = () => {
      document.getElementById("weekDisplay").textContent = "Week: " + weekParam;
      const supabaseUrl = "https://anjuypoheypwalafesgl.supabase.co";
      const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuanV5cG9oZXlwd2FsYWZlc2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkwMzg0OTQsImV4cCI6MjA2NDYxNDQ5NH0.Xmm95V8eTMTkPXmnT73iKc--Oryn9Z_RJXBrANhjnwQ";
      const client = supabase.createClient(supabaseUrl, supabaseKey);

      function getToday() {
        return new Date().toISOString().split('T')[0];
      }

      function getDeviceId() {
        let id = localStorage.getItem("deviceId");
        if (!id) {
          id = crypto.randomUUID();
          localStorage.setItem("deviceId", id);
        }
        return id;
      }

      function isThursdayAfter12() {
        const now = new Date();
        const dayOfWeek = now.getDay(); // 0=Sunday, 4=Thursday
        const currentHour = now.getHours();
        return dayOfWeek === 4 && currentHour >= 12;
      }

      // Team-editable limits (limits.js); defaults until loaded
      let limits = { ...DEFAULT_LIMITS, ok: false };

      // Shows the blinking warning if the visitor's number is above the
      // weekly limit. Uses the current limit, so if the team raises it,
      // the warning disappears on the next refresh.
      function updateWarning() {
        const warning = document.getElementById("limitWarning");
        if (isThursdayAfter12() && myNumber !== null && Number(myNumber) > limits.weeklyLimit) {
          warning.textContent = limitWarningText(limits.weeklyLimit);
          warning.style.display = "block";
        } else {
          warning.style.display = "none";
        }

        // Before distribution starts: announce the weekly limit, if one is set
        const announcement = document.getElementById("limitAnnouncement");
        const announcementText = limitAnnouncementText(limits);
        if (!isThursdayAfter12() && announcementText) {
          announcement.textContent = announcementText;
          announcement.style.display = "block";
        } else {
          announcement.style.display = "none";
        }
      }

      let myNumber = localStorage.getItem("myNumber");
      let myDate = localStorage.getItem("myDate");
      let myTime = localStorage.getItem("myTime");
      const today = getToday();

      function updateUI() {
        const now = new Date();
        const dayOfWeek = now.getDay();
        const currentHour = now.getHours();
        const btn = document.getElementById("drawButton");
        const info = document.getElementById("timeInfo");

        // Prüfen ob Donnerstag nach 12
        if (!isThursdayAfter12()) {
          btn.disabled = true;
          const numberDisplay = document.getElementById("yourNumber");
          if (dayOfWeek !== 4) {
            numberDisplay.textContent = "Numbers can only be obtained on Thursdays after 12:00.";
            numberDisplay.classList.add("closed-notice");
            numberDisplay.style.fontSize = "";
            numberDisplay.style.fontWeight = "400";
            numberDisplay.style.webkitTextStroke = "0";
            numberDisplay.style.textShadow = "none";
          } else if (currentHour < 12) {
            numberDisplay.textContent = "Distribution of numbers will not begin until 12:00.";
            numberDisplay.classList.add("closed-notice");
            numberDisplay.style.fontSize = "";
            numberDisplay.style.fontWeight = "400";
            numberDisplay.style.webkitTextStroke = "0";
            numberDisplay.style.textShadow = "none";
          }
          document.getElementById("timestamp").textContent = "";
          info.textContent = "";
        } else {
          document.getElementById("yourNumber").textContent = myNumber || "--";
          document.getElementById("yourNumber").classList.remove("closed-notice");
          document.getElementById("yourNumber").style.fontSize = "8em";
          document.getElementById("yourNumber").style.fontWeight = "900";
          document.getElementById("yourNumber").style.webkitTextStroke = "0.8px rgba(120,0,60,0.35)";
          document.getElementById("yourNumber").style.textShadow = "0 2px 0 rgba(0,0,0,0.06), 0 6px 12px rgba(0,0,0,0.04)";
          document.getElementById("timestamp").textContent = myTime
            ? "You received a number at: " + myTime
            : "No number yet";
          // Donnerstag nach 12: prüfen ob schon eine Nummer gezogen wurde
          if (myNumber !== null) {
            btn.style.display = "none";
            info.textContent = "";
          } else {
            btn.disabled = false;
            info.textContent = "";
          }
        }
        updateWarning();
      }

      // Reloads the limits, then redraws
      async function refreshLimits() {
        limits = await loadLimits(client);
        updateUI();
      }

      // Reset, falls nicht von heute
      if (myDate !== today) {
        localStorage.removeItem("myNumber");
        localStorage.removeItem("myDate");
        localStorage.removeItem("myTime");
        myNumber = null;
        myTime = null;
      }

      updateUI();
      refreshLimits();

      // prüft jede Minute erneut (inkl. aktueller Limits)
      setInterval(refreshLimits, 60000);

      async function drawNumber() {
        if (!isThursdayAfter12()) {
          alert("Numbers can only be obtained on Thursdays after 12:00.");
          return;
        }

        const deviceId = getDeviceId();

        const { data: existing, error: checkError } = await client
          .from('queue')
          .select('*')
          .eq('date', today)
          .eq('device_id', deviceId)
          .limit(1);

        if (checkError) {
          alert("Error bei der Prüfung: " + checkError.message);
          return;
        }

        if (existing.length > 0) {
          alert("Du hast heute schon eine Nummer bekommen.");
          return;
        }

        // Current limits at the moment of drawing (absolute maximum set by the team)
        limits = await loadLimits(client);
        const maxNumber = limits.absoluteMax;
        const { data: latest, error: readError } = await client
          .from('queue')
          .select('number')
          .eq('date', today)
          .order('number', { ascending: false })
          .limit(1);

        if (readError) {
          alert("Fehler beim Lesen der letzten Nummer: " + readError.message);
          return;
        }

        const lastNumber = latest && latest.length > 0 ? latest[0].number : 0;

        if (lastNumber >= maxNumber) {
          const numberDisplay = document.getElementById("yourNumber");
          numberDisplay.textContent = "We are full! Today no number anymore available - we can not change for you!";
          numberDisplay.style.color = "hotpink";
          numberDisplay.style.fontSize = "3em";
          numberDisplay.style.fontFamily = "'Rubik', sans-serif";

          document.getElementById("timestamp").style.display = "none";
          document.getElementById("drawButton").style.display = "none";
          return;
        }

        const newNumber = lastNumber + 1;
        const timestamp = new Date();
        const isoString = timestamp.toISOString();

        const { error: insertError } = await client
          .from('queue')
          .insert([{
            number: newNumber,
            date: today,
            created_at: isoString,
            device_id: deviceId
          }]);

        if (!insertError) {
          myNumber = newNumber;
          myTime = timestamp.toLocaleTimeString();
          localStorage.setItem("myNumber", myNumber);
          localStorage.setItem("myDate", today);
          localStorage.setItem("myTime", myTime);
          updateUI();
        } else {
          alert("Fehler beim Einfügen: " + insertError.message);
        }
      }

      document.getElementById("drawButton").addEventListener("click", drawNumber);
    };
  </script>
</body>
</html>
